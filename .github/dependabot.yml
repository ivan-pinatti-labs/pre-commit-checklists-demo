---
version: 2

# Dependabot handles the library's rev: pin in .pre-commit-config.yaml and
# every uses: pin under .github/workflows/. Renovate handles .tool-versions,
# the one pin surface neither Dependabot ecosystem below can parse; see
# renovate.json5. The third ecosystem here, pip, predates this repository's
# merge pipeline (docs/MERGE_PIPELINE.md) and is deliberately left outside
# it; see that ecosystem's own comment below for why.
#
# Every ecosystem runs daily, matching Renovate. Note that Dependabot's
# "daily" means weekdays only, not all seven days.
#
# Until 2026-09-02 these were Wednesday 08:00 and 08:30 with pip on Monday
# 07:00, this repository's assigned slot in a per-repository table in
# ivan-pinatti-labs/.github's docs/BOT_SCHEDULE.md, which spread repositories
# so their bots would not open pull requests in the same hour and queue
# behind each other for CodeRabbit's installation-wide review quota. The
# premise was wrong in exactly the way renovate.json5 below already argued
# for Renovate: a pin-only bump resolves `Review Verified` through the bot
# lane with CodeRabbit never asked, and that is true of Dependabot's
# pin-only bumps too. The table rationed a quota neither bot spent, while a
# weekly slot stacked on the seven day cooldown and made the real floor 7 to
# 14 days. See that repository's README.md, "Dependency policy".
#
# The pairing this repository used to keep visible, landing alongside
# ivan-pinatti-labs/pre-commit-checklists (the library it demonstrates) in
# one morning, is better served by both running daily: a bump that affects
# the library and its consumer now reaches both within a day of each other
# rather than within the same reserved morning once a week.
updates:
  # Covers the rev: pin on pre-commit-checklists inside
  # .pre-commit-config.yaml. Dependabot's pre-commit ecosystem only ever
  # reads a file literally named .pre-commit-config.yaml, which is this
  # repository's only pre-commit config, so nothing here needs to watch
  # anywhere else.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "America/Toronto"
    # Seven days, matching Renovate's minimumReleaseAge in renovate.json5.
    # Both bots carry the same floor deliberately: `Pin Only`
    # (scripts/assert-pin-only-diff.py) proves a diff changed nothing but a
    # version, but it cannot tell a good release from a backdoored one, and
    # this ecosystem executes arbitrary code on a developer's machine, which
    # is the larger attack surface here, not the smaller. Applies to version
    # updates only, never to Dependabot security updates, the same carve-out
    # as renovate.json5's vulnerabilityAlerts.minimumReleaseAge: null.
    # default-days is the only key used: GitHub's semver-major/minor/patch-days
    # keys apply only to an ecosystem list that includes neither pre-commit
    # nor github-actions, so setting them here would be configuration that
    # silently does nothing. See ivan-pinatti-labs/.github's
    # README.md, "Both bots wait seven days".
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - pre-commit
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  # Covers every uses: line under .github/workflows/, added alongside this
  # repository's own merge pipeline (docs/MERGE_PIPELINE.md): before that,
  # this repository had no workflow files for this ecosystem to watch at
  # all. Pin actions to a full commit SHA with a trailing "# vX.Y.Z" comment
  # (see the workflows in this directory for the pattern) so Dependabot can
  # resolve a bump.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "America/Toronto"
    # Same seven day cooldown as the pre-commit block above, and the same
    # default-days-only reasoning; see its comment and
    # README.md's "Both bots wait seven days". This ecosystem executes
    # arbitrary code in CI holding a token, the other larger attack surface
    # alongside pre-commit hooks.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Covers requirements.txt (pyyaml). pyproject.toml carries no dependency
  # list of its own, only project metadata and ruff config, so there is
  # nothing else for this ecosystem to read in this directory.
  #
  # Deliberately outside this repository's merge pipeline
  # (docs/MERGE_PIPELINE.md): requirements.txt is not one of
  # scripts/assert-pin-only-diff.py's allowed pin surfaces, so a bump here
  # always fails `Pin Only`, which means bot-auto-merge.yml never approves it
  # and it is always graded, and merged, like a human pull request. See that
  # script's own docstring for the reasoning behind what is, and is not, on
  # the allowed list.
  #
  # That is about who merges it, not about whether age helps, and an earlier
  # version of this comment conflated the two: it declined a cooldown here on
  # the grounds that aging only matters for a surface that can merge
  # unattended. It does not follow. A person approving `pyyaml 6.0.2` to
  # `6.0.3` can no more tell a backdoored release from a good one than
  # assert-pin-only-diff.py can, which is the argument that script makes about
  # its own limits. Review catches intent in a diff; it does not catch a
  # compromised upstream artifact. Age is what buys the time for a bad release
  # to be spotted and pulled, and it does that whoever clicks merge.
  #
  # Seven days, matching the other two ecosystems above and every sibling
  # repository. Note this is not the difference between a window and no
  # window: since 2026-07-14 Dependabot applies a three day default to version
  # updates in every ecosystem, so leaving this unset was silently taking
  # three rather than none. Setting it makes the number this organization
  # chose explicit instead of inherited.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "America/Toronto"
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
