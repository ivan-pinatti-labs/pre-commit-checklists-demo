---
# Checked by checklist-markdown (markdownlint-cli2).

# Automatically fix problems markdownlint-cli2 knows how to fix.
fix: true

# MD013: line-length. Relaxed to 100 to match .editorconfig, and turned
# off inside code blocks and tables, where wrapping is usually wrong.
MD013:
  line_length: 100
  code_blocks: false
  tables: false

# MD033: no-inline-html. The README's Support block needs raw HTML for the
# centred badge row and the sponsor QR grid; Markdown has no equivalent for
# either. Allow only the elements that block actually uses, so unrelated
# inline HTML elsewhere still gets flagged.
MD033:
  allowed_elements: [a, br, code, div, img, table, td, tr]
