---
name: PR Validation

# This is templates/workflows/pull-request.yml from the pre-commit-checklists
# library, adopted here as this demo's own CI: the first place that shipped
# template has ever actually run. See README.md, "Pointing this at the
# published library", for the rest of the adoption path this repository
# follows.
#
# The pre-commit job below publishes the exact check context "Pre-commit"
# (its name:, not its job id): docs/MERGE_PIPELINE.md's coderabbit-gate.yml,
# bot-auto-merge.yml, and coderabbit-review-queue.yml all hardcode that
# string as a required context to wait on. It was named "Pre-Commit Checks"
# before this repository's merge pipeline was ported in from
# ivan-pinatti-labs/rsync-crypt; renaming a required check's context after
# branch protection already requires the old name breaks the very next pull
# request until branch protection is updated to match, which is why that
# update ships in the same change that renamed this job (see
# docs/MERGE_PIPELINE.md, "The bootstrap gap this pipeline was ported
# through").
#
# No personal access token is needed anywhere in this file: checking out
# this repository's own PR branch, and building the Dockerfile standalone,
# are everything the default GITHUB_TOKEN's read access is scoped for. No
# other services are wired into this pipeline.

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Required checks are evaluated against the merge queue's own temporary
  # commit, not a pull request's head, once main's merge_group ruleset is in
  # place (see docs/MERGE_PIPELINE.md). The pre-commit job below needs this
  # trigger or the queue stalls forever waiting for a "Pre-commit" context
  # that never gets republished on its commit. Docker Build runs again here
  # too, same as rsync-crypt's copy of this file, even though it is not
  # required: nothing about it is queue-specific enough to be worth gating
  # out.
  merge_group:

# A new push supersedes whatever this workflow is still doing for the same
# PR, so a rapid series of pushes doesn't leave several stale runs racing
# each other. github.event.pull_request.number is unset on a merge_group
# event, so that alone would put every merge-queue run into the same group
# and let cancel-in-progress cancel a run the queue still needs; falling
# back to merge_group.head_ref (unique per queue entry) and then github.ref
# keeps each queue entry, and any other trigger shape, in its own group.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # persist-credentials is set to false because nothing in this job
      # pushes, so the checked out credential has no reason to survive
      # past this step.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|

      # Pinned to match .tool-versions, so this job and a local
      # `pre-commit install` always run the identical release.
      - name: Install pre-commit
        run: pip install "pre-commit==4.5.1"

      # Every checklist wired into .pre-commit-config.yaml here needs only
      # what the ubuntu-24.04 runner already ships (Docker for
      # checklist-dev-docker's hadolint-docker hook; Python for the rest),
      # so no extra toolchain setup step belongs in this job.
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color always

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A required check, and the reason requirements.txt is allowed to be a
    # `Pin Only` surface at all. A pyyaml bump merges here without a human
    # reading it, which is only defensible because something runs the new
    # pyyaml first: tests/test_check_disk_usage.py's
    # test_load_config_parses_the_shipped_config reads the real config.yaml
    # through check_disk_usage.load_config, the one place this project calls
    # into yaml. Verified that the gate bites: with pyyaml uninstalled the
    # suite fails at collection, and a parse that returns the wrong mapping
    # fails that test.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Both files: requirements.txt carries the runtime dependency the tests
      # exercise, tests/requirements.txt carries pytest itself.
      - name: Install dependencies
        run: pip install -r requirements.txt -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

  docker-build:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Not a required check; see docs/MERGE_PIPELINE.md. checklist-dev-docker
    # already lints Dockerfile with hadolint above, but linting does not
    # prove the image actually builds (a bad COPY path or a broken RUN step
    # passes hadolint cleanly), and this repository's whole point is
    # exercising real files with real tools, so a standalone build is worth
    # having even though nothing here depends on it. Kept non-required,
    # unlike ivan-pinatti-labs/rsync-crypt's Docker Build job: that job also
    # probes whether Docker Hub credentials survive a repository transfer,
    # which does not apply here since this repository has never carried
    # those secrets and has no reason to log in to pull a public
    # python:3.12-slim base image.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag pre-commit-checklists-demo:ci .
