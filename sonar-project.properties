# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# The project is analyzed from CI with Automatic Analysis turned off in the
# project settings: the two cannot run side by side, and a CI scan aborts
# while Automatic Analysis is on.
sonar.organization=ivan-pinatti-labs
sonar.projectKey=ivan-pinatti-labs_pre-commit-checklists-demo
sonar.projectName=pre-commit-checklists-demo

# Sources are the whole tree rather than a list of files, so a new file is
# analyzed without anyone remembering to add it here. Sonar only reads the
# languages it has an analyzer for (Python, shell, the Dockerfile, YAML and
# GitHub Actions here) plus its secrets detection, which runs over every text
# file. tests/ is analyzed as test code, which Sonar holds to a different
# rule set, so it is excluded from sources to keep the two disjoint.
# .secrets.baseline is generated by detect-secrets and only records hashes.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,coverage/**,.secrets.baseline
sonar.test.inclusions=tests/**

# The interpreter the Tests job runs, so rules that depend on the language
# version judge the code against the one it actually runs on.
sonar.python.version=3.14

# Written by `make coverage` (sonarqube.yml's "Measure coverage" step), never
# committed. shell.xml is kcov's report of the shell script, in SonarQube's
# generic coverage format, since SonarQube has no shell coverage importer.
sonar.python.coverage.reportPaths=coverage/coverage.xml
sonar.coverageReportPaths=coverage/shell.xml

sonar.sourceEncoding=UTF-8
