version: 2
updates:
  # Watches the rev: pin on pre-commit-checklists inside
  # .pre-commit-config.yaml, the same way it would for any hook repo.
  #
  # repo: on that entry is https://github.com/ivan-pinatti/pre-commit-checklists,
  # a resolvable transport, so this ecosystem entry can see the pin and
  # open a pull request when a newer tag is released.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Toronto"
    labels:
      - dependencies
      - pre-commit
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5

  # Covers requirements.txt (pyyaml). pyproject.toml carries no dependency
  # list of its own, only project metadata and ruff config, so there is
  # nothing else for this ecosystem to read in this directory.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "America/Toronto"
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
