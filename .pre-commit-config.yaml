---
# This demo consumes the pre-commit-checklists library the way a real
# project does: one `repo:` entry pinned to a `rev:` tag, then a list of
# hook ids, exactly like templates/pre-commit-config/recommended.yaml in
# that library.
#
# ivan-pinatti-labs/pre-commit-checklists is public, so `repo:` below points
# at the real GitHub URL, pinned to its `rev:` release tag. See README.md,
# "Pointing this at the published library", for how this was verified, and
# docs/MERGE_PIPELINE.md for how this repository's own pull requests are
# gated now that it has a merge pipeline of its own.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: https://github.com/ivan-pinatti-labs/pre-commit-checklists
    rev: v3.3.0
    hooks:
      # Large-file/merge-conflict/line-ending hygiene, safe on any repo.
      - id: checklist-basic
        stages: [pre-commit]

      # Spell-checks every file cspell can read; tune words in .cspell.json.
      - id: checklist-spell
        stages: [pre-commit]

      # Lints and link-checks Markdown. Exercised by README.md.
      - id: checklist-markdown
        types: [markdown]
        stages: [pre-commit]

      # Validates YAML syntax, lints with yamllint, formats with Prettier.
      # Exercised by config.yaml and, now that this repository ships real
      # workflows, by every file under .github/workflows/ as well.
      # .github/renovate.json5 is JSON5, not YAML, so it is not one of this
      # hook id's files; .github/dependabot.yml used to be, before it was
      # deleted as part of this repository's migration to Renovate as the
      # sole dependency bot (see docs/MERGE_PIPELINE.md).
      - id: checklist-yaml
        types: [yaml]
        stages: [pre-commit]

      # Validates TOML syntax. Exercised by pyproject.toml.
      - id: checklist-toml
        types: [toml]
        stages: [pre-commit]

      # Blocks committed private keys and known secret patterns. Requires
      # .secrets.baseline at the repo root, generated below.
      - id: checklist-security-credentials
        stages: [pre-commit]

      # Checks every tracked file respects .editorconfig.
      - id: checklist-dev-editorconfig
        stages: [pre-commit]

      # check-executables-have-shebangs, check-shebang-scripts-are-executable,
      # shellcheck --severity=error, shfmt --indent 2. Exercised by
      # rotate-logs.sh.
      - id: checklist-dev-shell
        types: [shell]
        stages: [pre-commit]

      # check-ast, check-builtin-literals, debug-statements, ruff-check
      # --fix, ruff-format, requirements-txt-fixer. Exercised by
      # check_disk_usage.py and requirements.txt.
      - id: checklist-dev-python
        files: '(\.py$|(^|/)requirements\.txt$)'
        stages: [pre-commit]

      # actionlint-docker and zizmor, scoped to .github/. Added alongside
      # this repository's own merge pipeline (docs/MERGE_PIPELINE.md):
      # before that, this demo had no .github/workflows/ content at all, so
      # this hook id had nothing to check and stayed off the list, exactly
      # as README.md's "What's here" table used to say. It now has four
      # real workflow files plus renovate.json5, all real surfaces this
      # hook id is meant to catch problems in.
      - id: checklist-github-actions
        files: ^\.github/
        stages: [pre-commit]

      # Rejects branch names that skip the naming convention. No ticket
      # prefix required by default.
      - id: checklist-git-valid-branches
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Rejects commit messages that are not Conventional Commits. Runs at
      # the commit-msg git stage, not pre-commit, which is why
      # default_install_hook_types above lists both stages.
      - id: checklist-git-commit-msg
        args: ["--no-ai-attribution"]
        stages: [commit-msg]
        files: COMMIT_EDITMSG$

      # Blocks direct commits to main/master/develop/staging.
      - id: checklist-git-protected-branches
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # hadolint-docker, run in a container via pre-commit's own
      # docker_image language support, needs Docker specifically (that
      # support shells out to the literal `docker` binary, unlike
      # checklist-dev-dotenv's local hook, which accepts Podman too). The
      # hook's own types: [dockerfile] selector already scopes it, so no
      # selector is added here, matching the library's hook catalogue.
      # Exercised by Dockerfile.
      - id: checklist-dev-docker
        stages: [pre-commit]

  # The one hook here that is not from the library: this repository's own
  # coverage gate, 100% of the Python (lines and branches) and of the shell
  # (lines). `make coverage` runs both test suites in podman containers that
  # see the source only through a tar stream; see the Makefile. pre-push, not
  # pre-commit: it starts two containers, and SonarQube's CI job runs the
  # same target on every pull request anyway, so this only saves a round
  # trip. A consumer of the library has no reason to copy it.
  - repo: local
    hooks:
      - id: coverage
        name: Coverage, 100% of the Python and the shell
        language: system
        entry: make coverage
        pass_filenames: false
        files: '(\.py$|\.(sh|bash)$|^\.coveragerc$|^Makefile$|requirements\.txt$)'
        stages: [pre-push]
